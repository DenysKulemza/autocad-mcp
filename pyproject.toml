[project]
name = "autocad-mcp"
version = "0.1.0"
description = "Headless MCP server for AutoCAD-compatible DXF drawings (macOS friendly, no AutoCAD required)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "ezdxf>=1.4,<2",
    "Pillow>=10",
    "matplotlib>=3.8",
]

[project.scripts]
autocad-mcp = "autocad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "ezdxf.addons.drawing.matplotlib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ezdxf re-exports its public API from submodules without __all__
module = ["ezdxf", "ezdxf.*"]
implicit_reexport = true
